plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'de.shyim.sockspring'
    compileSdk 37
    ndkVersion '26.3.11579264'
    defaultConfig {
        applicationId 'de.shyim.sockspring'
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName '1.0.0'
        ndk { abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64' }
    }
    signingConfigs { release {} }
    def propsFile = rootProject.file('upload-signing.properties')
    if (propsFile.exists()) {
        def props = new Properties()
        propsFile.withInputStream { props.load(it) }
        signingConfigs.release {
            storeFile rootProject.file(props['storeFile'])
            storePassword props['storePassword']
            keyAlias props['keyAlias']
            keyPassword props['keyPassword']
        }
    }
    buildTypes {
        release {
            if (propsFile.exists()) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    buildFeatures { compose true; buildConfig true }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.jniLibs.srcDirs = [layout.buildDirectory.dir('rustJniLibs')]
    packaging { jniLibs { useLegacyPackaging false } }
    dependenciesInfo { includeInApk false; includeInBundle false }
}

kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }

def buildRust = tasks.register('buildRust', Exec) {
    workingDir rootProject.projectDir
    commandLine 'sh', rootProject.file('scripts/build-rust.sh'), androidComponents.sdkComponents.sdkDirectory.get().asFile.absolutePath, android.ndkVersion, layout.buildDirectory.dir('rustJniLibs').get().asFile.absolutePath
    inputs.files(rootProject.fileTree('native/src'), rootProject.file('native/Cargo.toml'), rootProject.file('native/Cargo.lock'), rootProject.file('scripts/build-rust.sh'))
    outputs.dir(layout.buildDirectory.dir('rustJniLibs'))
}
tasks.configureEach {
    if (name == 'preBuild' || name.matches('merge.*JniLibFolders')) { dependsOn buildRust }
}
dependencies {
    testImplementation 'junit:junit:4.13.2'
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation 'androidx.compose.material3:material3:1.5.0-rc01'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.10.0'
    implementation 'androidx.core:core-ktx:1.17.0'
    debugImplementation 'androidx.compose.ui:ui-tooling'
}
